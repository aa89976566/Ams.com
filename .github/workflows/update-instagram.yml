name: Update Instagram Videos

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Instagram reels
        run: python3 scripts/fetch-instagram.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram-videos.json images/instagram/ videos/instagram/
          git diff --staged --quiet || git commit -m "chore: refresh Instagram reels from @coach_kings2"
          git push
